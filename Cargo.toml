[package]
name = "klangbench"
version = "0.1.0"
edition = "2021"
description = "High-performance modular audio generation and vintage test equipment emulation workstation"
authors = ["KlangBench Audio Lab"]
license = "MIT"
readme = "README.md"
keywords = ["audio", "dsp", "synthesizer", "test-equipment", "tui"]
categories = ["multimedia::audio", "command-line-interface", "simulation"]

[dependencies]
cpal = "0.15"
ratatui = "0.28"
crossterm = "0.28"
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
rtrb = "0.3"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "pcm", "isomp4"] }
chrono = "0.4"
anyhow = "1.0"
rand = "0.8"
parking_lot = "0.12"
futures-util = "0.3"
